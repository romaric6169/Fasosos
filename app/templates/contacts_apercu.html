{% extends "base.html" %}
{% block title %}Mes contacts d'urgence - FasoSOS{% endblock %}

{% block content %}
<nav class="navbar navbar-light bg-white border-bottom px-3" style="height:60px;">
    <a href="/" class="navbar-brand mb-0 h1">🚨 FasoSOS</a>
    <span id="nom-utilisateur" class="text-muted"></span>
</nav>

<div class="container py-4" style="max-width: 700px;">
    <h4 class="mb-3">Mes contacts d'urgence</h4>
    <p class="text-muted">Appelez ou envoyez un SMS directement à l'un de vos contacts.</p>

    <div id="alerte-contacts" class="alert d-none"></div>

    <div id="liste-contacts-apercu"></div>

    <a href="/" class="btn btn-outline-secondary w-100 mt-3">← Retour à la carte</a>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/contacts_apercu.js') }}"></script>
{% endblock %}
