{% extends "base.html" %}
{% block title %}Mon profil - FasoSOS{% endblock %}

{% block content %}
<nav class="navbar navbar-light bg-white border-bottom px-3" style="height:60px;">
    <a href="/" class="navbar-brand mb-0 h1">🚨 FasoSOS</a>
    <div>
        <span id="nom-utilisateur" class="text-muted me-3"></span>
        <button id="btn-deconnexion" class="btn btn-sm btn-outline-danger">Déconnexion</button>
    </div>
</nav>

<div class="d-flex justify-content-center py-5 bg-light" style="min-height: calc(100vh - 60px);">
    <div class="card shadow p-4" style="max-width: 480px; width: 100%; height: fit-content;">
        <h4 class="mb-4">Mon profil</h4>

        <div id="alerte-profil" class="alert d-none"></div>

        <form id="form-profil">
            <div class="mb-3">
                <label class="form-label">Nom complet</label>
                <input type="text" class="form-control" id="profil-nom" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Téléphone</label>
                <input type="text" class="form-control" id="profil-telephone" disabled>
                <div class="form-text">Le téléphone ne peut pas être modifié.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="profil-email">
            </div>
            <div class="mb-3">
                <label class="form-label">Rôle</label>
                <input type="text" class="form-control" id="profil-role" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Membre depuis</label>
                <input type="text" class="form-control" id="profil-date" disabled>
            </div>
            <button type="submit" class="btn btn-danger w-100">Enregistrer les modifications</button>
        </form>

        <hr class="my-4">

        <a href="/contacts/gerer" class="btn btn-outline-danger w-100 mb-2">📞 Gérer mes contacts d'urgence</a>
        <a href="/" class="btn btn-outline-secondary w-100">← Retour à la carte</a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/profil.js') }}"></script>
{% endblock %}
